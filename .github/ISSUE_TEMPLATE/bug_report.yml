name: Bug Report
description: Report a bug, regression, or unexpected behavior in OpenMatrix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in OpenMatrix. Please do **not** include API keys, confidential PDFs, or sensitive credentials.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start OpenMatrix with ...
        2. Upload / run ...
        3. Observe error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, and deployment method (Docker / Local / Windows script).
      placeholder: "Ubuntu 24.04 / Docker Compose / Python 3.12"
